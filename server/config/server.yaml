server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  tls:
    enabled: false
security:
  agent_token: "changeme"
  api_keys:
    - "changeme"
database:
  in_memory: true
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0
  queue_key: "d-eyes:task-queue"
scheduler:
  lease_ttl: 120s
  max_retries: 3
  heartbeat_timeout: 15s
metrics:
  enabled: true
  path: /metrics
audit:
  enabled: true
  log_path: /var/log/d-eyes/bas-audit.log
alerts:
  enabled: true
  channel: log
  notify_bas_failure: true
  notify_sandbox_fallback: true
templates:
  persist_path: /var/lib/d-eyes/templates.json
task_catalog:
  # Task Catalog 持久化路径（可选）：
  # - 留空：catalog 仅存在于内存，进程重启后会回到空状态并再次导入内置 seed
  # - 非空：Server 会在首次导入 seed / 通过 API 变更后写入该 JSON 文件（原子写入）
  persist_path: /var/lib/d-eyes/task_catalog.json
