server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  tls:
    enabled: false
security:
  agent_token: "changeme"
  api_keys:
    - "changeme"
database:
  in_memory: true
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0
  queue_key: "d-eyes:task-queue"
scheduler:
  lease_ttl: 120s
  max_retries: 3
  heartbeat_timeout: 15s
metrics:
  enabled: true
  path: /metrics
audit:
  enabled: true
  log_path: /var/log/d-eyes/bas-audit.log
alerts:
  enabled: true
  channel: log
  notify_bas_failure: true
  notify_sandbox_fallback: true
templates:
  persist_path: /var/lib/d-eyes/templates.json
